<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Kommerz Raider</title>
    <meta name="theme-color" content="#0b1220" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
      /* Self-hosted type (V2): the technical backbone and the typewriter
         flavour. Licences and provenance in public/fonts/. */
      @font-face {
        font-family: 'Jost';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/jost-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Jost';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('fonts/jost-600.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Cutive Mono';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/cutive-mono-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Special Elite';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('fonts/special-elite-400.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background: #000;
      }
      canvas {
        display: block;
        /* The battle view handles its own drag-pan and pinch-zoom, so the
           browser must not claim touch gestures on the canvas. */
        touch-action: none;
      }
      #hud {
        position: fixed;
        inset: 0;
        /* The chart HUD's own tier (August 2026). It used to carry no
           z-index, which was only safe while nothing was layered over the
           canvas: both world renderers seat a canvas of their own BEHIND
           the shared one and promote the shared one to z-index 1 to get
           underneath it, and a positioned z-1 canvas paints above a
           positioned z-auto div. So the plot covered the helm strip and
           every tap meant for a button set a course instead. It sits below
           the battle strip (4), the briefs (9), the cards (10) and the menu
           tier (30), which is where it always belonged. */
        z-index: 2;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: var(--face-tech);
        color: var(--ink);
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      /* The readout lines sit tight (M4, small-iPhone playtest): the top
         block and the bottom strip both overlay the chart, so every spare
         pixel of padding here is stolen map. */
      .hud-top {
        padding: 4px 12px;
        background: rgba(var(--ground-rgb), 0.75);
      }
      .hud-bottom {
        padding: 6px 10px;
        background: rgba(var(--ground-rgb), 0.75);
      }
      .hud-top,
      .hud-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .hud-row + .hud-row {
        margin-top: 4px;
      }
      .hud-group {
        display: flex;
        gap: 6px;
      }
      .hud-top {
        font-size: calc(14px * var(--text-scale, 1));
        /* Lock the row height so the Jost swap can never grow the readout
           block on a small iPhone (owner caveat, July 2026). */
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
      }
      /* The ≡ button berths in the block's top-right corner, so the first
         two rows (the clock, the sky and its pip) stop short of it. Two
         rows cover the button's height at every text scale (the rows grow
         with the scale; the button barely does). */
      #hud > div:first-child > .hud-top:nth-child(-n + 2) {
        padding-right: 60px;
      }
      /* The fuel readout is an inline tank gauge — JS fills the background to
         the bunker level. Horizontal padding only, so the row keeps its
         height (the HUD caveat). */
      #hud-fuel {
        display: inline-block;
        padding: 0 5px;
        border-radius: 3px;
      }
      /* The clock has row one to itself and the reports pip sits at the
         right end of the sky row (owner ruling, 3 October 2026). Both rows
         are size containers so that their height is decided by the row's
         WIDTH and the text scale alone, never by what is in them: the pip
         appearing, a month name a few pixels wider, the day turning to
         night, the weather changing. A height that followed the content
         would shift the readouts and chips below on every change, and
         would re-fit the whole chart each time (the layout observes this
         block's height). The query widths are in em, which a container
         query reads at the row's own font size, so they track the
         text-scale setting. Measured in Jost, per em: the longest one-line
         clock is 18.1 (Nov, 253 px at scale 1); of the twelve sky lines
         (four weathers, each plain, "glass falling" or "glass rising") the
         longest, "Gale, glass falling — Heavy seas, inaccurate gunnery", is
         22.44 and the next, "Gale, glass rising — ...", 22.22; the
         longest pip "● 12 reports · Face unknown" is 12.5.
         The reserved heights are the DEFAULT and the queries release them
         where the row is wide enough to need none, so that a browser
         without container queries (iOS before 16), which ignores every
         @container rule and gets the narrow layouts, keeps the stable
         reserved heights and merely wastes a line on a wide screen. */
      .hud-clock,
      .hud-sky {
        container-type: inline-size;
      }
      /* The clock may need to wrap before its bracket, and which months do
         depends on the glyphs, so a row too tight for the widest clock
         (18.1 em, plus 0.9 em of slack for a wider sun glyph) always keeps
         the two lines the wrap needs, whether or not today's date fills
         them. */
      #hud-date {
        min-height: 2.4em;
      }
      @container (min-width: 19em) {
        #hud-date {
          min-height: 0;
        }
      }
      /* The sky takes the whole first line; the pip has the next line to
         itself, right-aligned, and keeps it blank when there is no pip, so
         that a report arriving fills a line that was already there. */
      .hud-sky {
        flex-wrap: wrap;
        row-gap: 0;
      }
      /* The weather keeps two lines in every weather wherever the longest
         sky line would wrap (owner ruling, 3 October 2026). Only Squall and
         Gale, with the glass, wrap on a phone, and a sky line that grew a
         line when the weather turned moved every control beneath it. Two
         lines are enough down to the narrowest supported row (13.6 em: 320
         px at text scale 1.3); the text stays on the first line, so a
         change of weather never moves the words, only the blank under them. */
      #hud-weather {
        flex: 1 1 100%;
        min-height: 2.4em;
      }
      /* Wide enough for the longest sky line on one line (22.44 em, plus
         0.16 em of slack, 2 px at scale 1), nothing is reserved: Clear
         and Overcast, and every weather on a roomy phone, keep a single
         line. */
      @container (min-width: 22.6em) {
        #hud-weather {
          min-height: 0;
        }
      }
      /* The reports pip and its count stay on one piece. */
      #hud-reports {
        margin-left: auto;
        min-height: 1.2em;
        text-align: right;
        white-space: nowrap;
      }
      /* Wide: the widest sky line and the widest pip fit side by side
         (22.4 + 12.5 em, a gap and slack), so the pip shares the sky's
         line and no second line is reserved. */
      @container (min-width: 38em) {
        #hud-weather {
          flex: 0 1 auto;
        }
      }
      .hud-message {
        margin: 8px auto 0;
        padding: 8px 14px;
        background: rgba(var(--ground-rgb), 0.85);
        border-radius: 6px;
        font-size: calc(14px * var(--text-scale, 1));
        max-width: 85%;
        text-align: center;
        /* The wireless line reads as the ship's log, in the typewriter. */
        font-family: var(--face-type);
      }
      /* A radiogram takes the distressed telegram face (Special Elite). */
      .hud-message.telegram {
        font-family: var(--face-stamp);
      }
      /* Sim-card narrative in the typewriter flavour on warm paper; the
         title takes the brass accent. Scoped to #card so the About screen's
         legal text (which reuses .card grammar) keeps the technical face. */
      #card .card-title {
        color: var(--brass);
      }
      #card .card-body {
        font-family: var(--face-type);
        line-height: 1.55;
        color: var(--flavour);
      }
      /* The misclick guard greys the options for its 1.5 s beat. */
      #card .card-option:disabled {
        opacity: 0.4;
        cursor: default;
      }
      /* A locked option — an unaffordable refit, shown so the player learns
         it exists. Dimmed but still readable (the cost is the whole point),
         with a dashed edge reading as 'not yet requisitioned' rather than a
         live control. Wins the transient greying above so the figure stays
         legible. */
      #card .card-option-locked:disabled {
        opacity: 0.7;
        cursor: default;
        background: rgba(var(--ground-rgb), 0.5);
        border-style: dashed;
      }
      /* Vital-info panel (patron standings on the home card): label muted,
         value in its own colour so what you hold reads at a glance. */
      #card .card-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 0 0 16px;
        padding: 10px 12px;
        background: rgba(var(--ground-rgb), 0.5);
        border: 1px solid var(--chrome-line);
        border-radius: 6px;
        font-family: var(--face-tech);
        font-size: calc(13px * var(--text-scale, 1));
      }
      #card .card-info-line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      #card .card-info-line span:first-child {
        color: var(--ink-mute);
      }
      #card .card-info-value {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      #hud-message-block {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* The don't-show-these-again line under a hint (M5 ruling). */
      #hud-hint-quiet {
        pointer-events: auto;
        display: none;
        margin: 4px auto 0;
        min-height: 30px;
        padding: 2px 10px;
        font-size: calc(12px * var(--text-scale, 1));
        color: var(--ink-mute);
        background: rgba(var(--ground-rgb), 0.85);
        border: 1px solid var(--chrome-line);
        border-radius: 6px;
      }
      /* touch-action on every control: iOS Safari otherwise reserves a
         ~350 ms double-tap-zoom window, and rapid HUD taps zoom the page */
      button {
        touch-action: manipulation;
        font-family: var(--face-tech);
      }
      #hud button {
        pointer-events: auto;
        /* Chart-HUD controls run 15% smaller than the 38px 10 mm floor
           (owner request, July 2026: the strategic strip stole too much
           chart on a small iPhone). Lands at 32px — still above the
           battle strip's own 31px, and the ~10 mm rule is a soft floor. */
        min-height: 32px;
        min-width: 48px;
        padding: 0 8.5px;
        font-size: calc(11px * var(--text-scale, 1));
        color: var(--ink);
        background: var(--chrome);
        border: 1px solid var(--chrome-line);
        border-radius: 6px;
      }
      #hud button.active {
        background: var(--chrome-active);
        border-color: var(--chrome-active-line);
      }
      /* A greyed-out control holds its place but reads as unavailable —
         e.g. the Arado at night keeps its slot instead of vanishing. */
      #hud button:disabled {
        opacity: 0.4;
      }
      #hud .officer-chip {
        pointer-events: auto;
        min-width: 44px;
        width: 44px;
        min-height: 44px;
        height: 44px;
        padding: 0;
        border-radius: 50%;
        overflow: hidden;
      }
      .officer-chip img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover; /* photographs of any aspect crop, never squash */
      }
      /* What became of a man, on the strip that is always on screen
         (§10 O2): hurt is dimmed, lost is drained of colour and ringed
         in the deficit ink. No badge, no icon — the wardroom is a row of
         faces, and a face that has gone grey says it without furniture. */
      #hud .officer-chip-hurt img {
        opacity: 0.5;
        filter: saturate(0.4);
      }
      #hud .officer-chip-lost {
        border-color: rgb(var(--heat-rgb));
      }
      /* Gone but alive: drained like a loss, but no red edge — the ship
         is not in mourning for a man in a French port. */
      #hud .officer-chip-detached img {
        opacity: 0.35;
        filter: grayscale(1);
      }
      #hud .officer-chip-lost img {
        opacity: 0.28;
        filter: grayscale(1);
      }
      #hud .patron-chip {
        border-radius: 8px; /* Berlin is square; the wardroom is round */
        position: relative;
      }
      .patron-badge {
        position: absolute;
        right: 1px;
        bottom: 1px;
        padding: 0 3px;
        border-radius: 6px;
        background: rgba(var(--ground-rgb), 0.85);
        font-size: calc(10px * var(--text-scale, 1));
        line-height: 14px;
        color: var(--ink);
      }
      /* The transient favour delta popped on a patron chip when the standing
         moves (patronPanel adds it only when cosmetic motion is allowed).
         Centred inside the chip so the round crop never clips it. */
      .patron-delta {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--face-tech);
        font-weight: 600;
        font-size: calc(15px * var(--text-scale, 1));
        background: rgba(var(--ground-rgb), 0.55);
        pointer-events: none;
        animation: favour-delta 2.4s ease-out forwards;
      }
      @keyframes favour-delta {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        15% {
          opacity: 1;
          transform: translateY(0);
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(-6px);
        }
      }
      .patron-standing {
        font-size: calc(14px * var(--text-scale, 1));
        margin-bottom: 4px;
      }
      .officer-detail {
        position: fixed;
        inset: 0;
        z-index: 5; /* sim cards (#card) always outrank the wardroom */
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--overlay);
        font-family: var(--face-tech);
        color: var(--ink);
        /* Clear of the notch and the home indicator (owner request
           August 2026): the card is capped at 90svh and centred, so
           without this its top edge and its last button can sit under
           the insets on a small iPhone — and a scrolled card would
           scroll its text under them too. */
        padding: max(16px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
        pointer-events: auto;
      }
      .officer-card {
        background: var(--panel);
        border: 1px solid var(--chrome-line);
        border-radius: 10px;
        max-width: 340px;
        width: 100%;
        padding: 18px;
        box-sizing: border-box;
        text-align: center;
      }
      .officer-card img {
        width: 160px;
        height: 160px;
        border-radius: 10px;
        border: 1px solid var(--chrome-line);
        object-fit: cover;
      }
      .officer-card h3 {
        margin: 10px 0 2px;
        font-size: calc(17px * var(--text-scale, 1));
        letter-spacing: 0.02em;
      }
      .officer-role {
        font-size: calc(13px * var(--text-scale, 1));
        opacity: 0.75;
        margin-bottom: 6px;
      }
      /* The wardroom card's figures (§10, O1): one row per skill the man
         carries, in the card grammar's own credit/deficit ink — the
         colour is set per row from the view, never here. */
      .officer-effects {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: left;
        margin: 8px 0 0;
        font-size: calc(13px * var(--text-scale, 1));
        letter-spacing: 0.01em;
      }
      .officer-notes p {
        text-align: left;
        font-size: calc(14px * var(--text-scale, 1));
        line-height: 1.45;
        margin: 8px 0 0;
      }
      #card,
      #start {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        align-items: center;
        justify-content: center;
        background: var(--overlay);
        font-family: var(--face-tech);
        color: var(--ink);
        padding: max(16px, env(safe-area-inset-top))
          max(16px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
      }
      /* Every overlay in the game is a .card — sim cards, the epilogue,
         the briefs, the menu tier, the title screen — so the fallback
         belongs here and nowhere else (owner request August 2026): text
         longer than the screen SCROLLS rather than pushing its own
         buttons off the bottom. The cap is what makes it scroll: without
         a max-height the box would simply grow past the viewport and the
         Weiter button would be unreachable. */
      .card {
        background: var(--panel);
        border: 1px solid var(--chrome-line);
        border-radius: 10px;
        max-width: 420px;
        width: 100%;
        /* svh: the small viewport unit ignores iOS Safari's collapsing
           URL bar; the vh line is the fallback for older engines */
        max-height: 90vh;
        max-height: 90svh;
        overflow-y: auto;
        /* The scroll stops at the card's own edges instead of chaining
           out to a page that cannot scroll — no rubber-banding the whole
           game behind an open card on iOS. */
        overscroll-behavior: contain;
        padding: 18px;
        box-sizing: border-box;
      }
      .card-title {
        margin: 0 0 10px;
        font-size: calc(18px * var(--text-scale, 1));
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      /* The epilogue's art banner: a fixed 16:9 frame above the title, so
         the card's height never depends on the picture that arrives in it
         (art is swappable data — portraits rule). */
      .card-image {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border: 1px solid var(--chrome-line);
        border-radius: 6px;
        margin: 0 0 12px;
      }
      .card-body {
        margin: 0 0 16px;
        font-size: calc(15px * var(--text-scale, 1));
        line-height: 1.45;
      }
      .card-options {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      /* Two options sharing one line (the context-loss notice, owner
         request Aug 2026): the same grammar, laid across. */
      .card-option-row {
        display: flex;
        gap: 8px;
      }
      .card-option-row .card-option {
        flex: 1;
      }
      .card-option {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        text-align: left;
        min-height: 44px;
        padding: 10px 12px;
        font-size: calc(14px * var(--text-scale, 1));
        color: var(--ink);
        background: var(--chrome);
        border: 1px solid var(--chrome-line);
        border-radius: 6px;
        /* A link can wear the row too (the about card's PayPal link). */
        text-decoration: none;
      }
      .card-option-label {
        font-weight: 600;
      }
      .card-option-detail {
        font-size: calc(12px * var(--text-scale, 1));
        color: var(--ink-mute);
      }
      /* Why a locked option is locked (owner report, playtest round five):
         its own red row under the effects — the one part of a dimmed
         option that must still shout. */
      .card-option-lock-reason {
        display: block;
        margin-top: 2px;
        font-family: var(--face-tech);
        font-size: calc(11.5px * var(--text-scale, 1));
        font-weight: 600;
        color: rgb(var(--heat-rgb));
      }
      /* The exact effects of an event option, itemized (§6 ruling, July
         2026): short technical-face rows under the detail, each coloured
         inline by the view's credit/deficit grammar. */
      .card-option-effects {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
        margin-top: 2px;
        font-family: var(--face-tech);
        font-size: calc(11.5px * var(--text-scale, 1));
      }
      #battle-hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 4;
        display: none;
        flex-direction: column;
        font-family: var(--face-tech);
        color: var(--ink);
        padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
        background: #0d1626;
        border-top: 1px solid #2c4064;
        /* The controls may never take more than 40% of the screen (owner
           ruling 18 Jul 2026, raising the M4 one-third cap). The console
           takes about 30% (owner ruling 3 Oct 2026: A, slimmed); the cap
           stays as the ceiling. svh/vh as .card. */
        max-height: 40vh;
        max-height: 40svh;
        box-sizing: border-box;
      }
      /* The battle console (COMBAT_UI_PROPOSALS.md, Proposal A; owner
         ruling 3 October 2026): four rows of instrument plates, ~9 mm
         tall, in loop order — helm, battery, orders, own ship. It
         replaces the old strip, whose 31 px buttons were ~5 mm on the
         playtest phones. The look is the engraved plate (§4.9): opaque,
         lit from above, brass for the lit state, a hatch for alarm —
         state is never told by colour alone. Only transform and opacity
         ever animate (the needle, a pressed plate). */
      #battle-hud .kc-console {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #battle-hud .kc-row {
        display: flex;
        gap: 6px;
        height: 56px;
      }
      #battle-hud .kc-plate {
        box-sizing: border-box;
        min-width: 0;
        margin: 0;
        padding: 0 4px;
        border-radius: 8px;
        border: 1px solid #4d6a94;
        background: linear-gradient(180deg, #273a5b 0%, #1a2840 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.09),
          0 1px 0 #050a13;
        color: var(--ink);
        font-family: var(--face-tech);
        font-size: calc(11px * var(--text-scale, 1));
        line-height: 1.15;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      #battle-hud button.kc-plate:active {
        transform: translateY(1px);
      }
      #battle-hud .kc-plate.on {
        border: 2px solid var(--brass);
        background: linear-gradient(180deg, #3d3725 0%, #28230f 100%);
        color: #f6e29a;
      }
      #battle-hud .kc-plate.alarm {
        border: 2px solid #f0a070;
        background: repeating-linear-gradient(
          135deg,
          #3a2118 0 6px,
          #2a1a14 6px 12px
        );
        color: #ffd2b8;
      }
      #battle-hud .kc-plate.quiet,
      #battle-hud .kc-plate:disabled {
        opacity: 0.45;
      }
      #battle-hud .kc-cap {
        font-size: calc(8.5px * var(--text-scale, 1));
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-mute);
        font-weight: 500;
      }
      #battle-hud .kc-plate.on .kc-cap {
        color: #e9d48a;
      }
      #battle-hud .kc-ico {
        width: 18px;
        height: 18px;
        flex: none;
